name: CI

# Gate C3b.2 — minimal, credential-free CI for pull requests targeting main.
# Four independent jobs (web, mobile, shared, backend). No secrets, no AWS,
# no deployment, no id-token. Read-only permissions. Draft PRs are included
# (GitHub runs pull_request workflows on drafts by default).

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  mobile:
    name: mobile (typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:ci

  shared:
    name: shared (contract validators)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The contract-adapter validator shells out to Python (stdlib ast) for
      # AST extraction, so Python must be available in this job.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node shared/validate-tokens.mjs
      - run: node shared/validate-constants.mjs
      - run: node shared/validate-adapters.mjs
      - run: node shared/validate-contract-adapters.mjs

  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    # Non-production, non-secret environment so botocore can construct clients.
    # The backend suite is hermetic: conftest.py mocks boto3 and the single
    # moto test uses in-memory mock_aws — no real AWS endpoint is contacted.
    # A region is required only to build client/resource objects at import time
    # (src/backend/common/db.py). Placeholder credentials and metadata-disabled
    # prevent any IMDS probe or real credential/endpoint resolution. These are
    # dummy values, never real credentials or GitHub secrets.
    env:
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/backend/requirements-ci.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r tests/backend/requirements-ci.txt
      - run: pytest tests/backend
